<!doctype html>
<html class="landing" lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>JAILBREAK PS4</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Every run starts from here. The referrer guard in jb.js arms the chain
         only when it was reached from this page, so that a browser restoring
         its last session cannot re-run it unattended. -->
    <div id="brand"><b>JAILBREAK PS4 - FIRMWARE 12.00 >>> 14.00  </b></div>

    <div class="shell">
      <img class="meme" src="images.jfif" alt="" />

      <main class="panel">
        <p class="lede">PS4 firmware 12.00 &ndash; 14.00 <span class="soon">&middot; 14.02 soon</span></p>

        <form class="pick" id="pick">
          <label class="opt">
            <input type="radio" name="payload" value="hen" />
            <span>ps4-hen</span>
          </label>
          <label class="opt">
            <input type="radio" name="payload" value="goldhen" checked />
            <span>GoldHEN</span>
          </label>

          <label class="opt opt-auto">
            <input type="checkbox" id="auto" checked />
            <span>autostart</span>
          </label>

          <button class="btn" type="submit">start</button>
          <p class="count" id="count"></p>
          <p class="count" id="cache" aria-live="polite"></p>
        </form>
      </main>
    </div>
    <p style="color: RED; font-size: 18px; margin-top: 20px;">Don't forget to block access to Sony's servers using the DNS 62.210.38.117</p>
    <p style="color: #0070d2; font-size: 18px;">ADD THE SITE TO YOUR BOOKMARKS</p>

    <p class="byline">BY BLACKPANTHA</p>
    <script src="launch.js"></script>
  </body>
</html>
